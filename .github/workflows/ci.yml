name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gajianich_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm ci --prefix backend || npm install --prefix backend
          npm ci --prefix frontend || npm install --prefix frontend

      - name: Validate Compose configurations
        run: |
          bash scripts/validate-compose.sh dev
          bash scripts/validate-compose.sh prod

      - name: Provision HR audit runtime role in ephemeral database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gajianich_ci_db
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              await client.query('CREATE ROLE gajianich_ci_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS');
            } finally {
              await client.end();
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Run Database Migrations and Seed against Ephemeral DB
        env:
          HR_AUDIT_RUNTIME_ROLE: gajianich_ci_runtime
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gajianich_ci_db
          JWT_SECRET: ci-jwt-secret-do-not-use-in-production-1234
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret-do-not-use-in-production-1234
          AGENT_API_KEY: ci-agent-key-do-not-use-in-production-1234
        run: |
          npm run db:migrate --prefix backend
          npm run seed --prefix backend

      - name: Run Backend Tests
        env:
          HR_AUDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gajianich_ci_db
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gajianich_ci_db
          JWT_SECRET: ci-jwt-secret-do-not-use-in-production-1234
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret-do-not-use-in-production-1234
          AGENT_API_KEY: ci-agent-key-do-not-use-in-production-1234
          NODE_ENV: test
        run: npm test --prefix backend

      - name: Build Backend
        run: npm run build --prefix backend

      - name: Test Frontend
        run: npm test --prefix frontend

      - name: Lint Frontend
        run: npm run lint --prefix frontend

      - name: Build Frontend (Standalone)
        run: npm run build --prefix frontend
