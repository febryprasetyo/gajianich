name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Release Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Release Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/gajianich-backend:${{ github.ref_name }}

      - name: Build and Push Frontend Release Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/gajianich-frontend:${{ github.ref_name }}

  deploy:
    name: Deploy to Production (LAN SSH)
    needs: build-and-publish
    runs-on: [self-hosted, linux, x64, gajianich-dev]
    environment: production

    steps:
      - name: Setup SSH Deployment Key & Pinned Host Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/gajianich_deploy_key"
          chmod 600 "$HOME/.ssh/gajianich_deploy_key"
          echo "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Execute Health-Gated Deployment on Production Host
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ssh -i "$HOME/.ssh/gajianich_deploy_key" "gajianich-deploy@$PROD_HOST" "/opt/gajianich/deploy/scripts/deploy.sh $RELEASE_TAG"

      - name: Cleanup SSH Keys
        if: always()
        run: |
          rm -f "$HOME/.ssh/gajianich_deploy_key"
