name: gajianich-live

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gajianich_prod_db
      POSTGRES_USER: gajianich_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production database password required}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gajianich_app -d gajianich_prod_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  backend:
    image: gajianich-lan-backend:${APP_VERSION:?Release version required}
    pull_policy: never
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      GA_STORAGE_DIR: /app/data/ga-evidence
      DATABASE_URL: ${DATABASE_URL:-postgresql://gajianich_app:${POSTGRES_PASSWORD}@postgres:5432/gajianich_prod_db}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Refresh secret required}
      AGENT_API_KEY: ${AGENT_API_KEY:?Agent key required}
      CORS_ALLOWED_ORIGINS: http://${LAN_BIND_ADDRESS:?LAN IP required}:${HTTP_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ga_evidence:/app/data/ga-evidence
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  frontend:
    image: gajianich-lan-frontend:${APP_VERSION:?Release version required}
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:5000/api/v1
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND_ADDRESS}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1/ && wget -q --spider http://127.0.0.1/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

volumes:
  ga_evidence:
  prod_pgdata:
