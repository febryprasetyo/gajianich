name: gajianich-prod

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: gajianich_proxy_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/${GHCR_OWNER:-febryprasetyo}/gajianich-backend:${APP_VERSION:?Release version required}
    container_name: gajianich_backend_prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5000
      NODE_ENV: production
      GA_STORAGE_DIR: /app/data/ga-evidence
      DATABASE_URL: ${DATABASE_URL:?Database URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Refresh secret required}
      AGENT_API_KEY: ${AGENT_API_KEY:?Agent key required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Production origin required}
    volumes:
      - ga_evidence:/app/data/ga-evidence
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/${GHCR_OWNER:-febryprasetyo}/gajianich-frontend:${APP_VERSION:?Release version required}
    container_name: gajianich_frontend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ga_evidence:
